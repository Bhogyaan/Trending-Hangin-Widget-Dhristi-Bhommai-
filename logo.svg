<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Golden Ring & Cord Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Cyan Gem Core Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="6"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Glowing Aura behind Mascot -->
  <circle cx="256" cy="300" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="300" r="80" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>

  <!-- Top Hanging Anchor Mount -->
  <g filter="url(#dropShadow)">
    <rect x="236" y="24" width="40" height="20" rx="8" fill="#475569" stroke="#64748b" stroke-width="3"/>
    <!-- Top Brass Ring -->
    <circle cx="256" cy="74" r="28" stroke="url(#goldGrad)" stroke-width="10" fill="none"/>
    <circle cx="256" cy="74" r="14" fill="#0f172a"/>
  </g>

  <!-- Braided Elastic Hanging Cord -->
  <g filter="url(#dropShadow)">
    <line x1="256" y1="102" x2="256" y2="190" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="256" y1="110" x2="256" y2="185" stroke="#fef08a" stroke-width="3" stroke-dasharray="6 8"/>
    <!-- Decorative Golden Knot -->
    <rect x="244" y="186" width="24" height="18" rx="8" fill="#d97706" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Central Talisman & Companion Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Outer Protective Sacred Ring -->
    <circle cx="256" cy="300" r="96" fill="#18181b" stroke="url(#goldGrad)" stroke-width="12"/>
    <!-- Inner Filigree Ring -->
    <circle cx="256" cy="300" r="82" stroke="#fde047" stroke-width="3" stroke-dasharray="8 8" opacity="0.85"/>

    <!-- Woven Geometric Web (Dreamcatcher / Sacred Geometry) -->
    <polygon points="256,220 312,244 336,300 312,356 256,380 200,356 176,300 200,244" stroke="#fde047" stroke-width="3" fill="none" opacity="0.75"/>
    <polygon points="256,248 296,268 308,300 296,332 256,352 216,332 204,300 216,268" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.85"/>

    <!-- Vibrant All-Seeing Cyan Gem Core -->
    <circle cx="256" cy="300" r="34" fill="url(#cyanGrad)" stroke="#a5f3fc" stroke-width="4"/>
    <!-- Obsidian Pupil & Sparkle -->
    <circle cx="256" cy="300" r="16" fill="#09090b"/>
    <circle cx="248" cy="292" r="7" fill="#ffffff"/>
    <circle cx="264" cy="308" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Hanging Feathers & Charms (Bottom Left & Right) -->
  <g filter="url(#dropShadow)">
    <!-- Left Dangling Feather -->
    <g transform="translate(196, 370) rotate(-14)">
      <line x1="0" y1="0" x2="-8" y2="40" stroke="#d97706" stroke-width="4"/>
      <circle cx="-4" cy="20" r="5" fill="#38bdf8"/>
      <!-- Feather blade -->
      <path d="M-8 40 C-24 60 -24 95 -8 115 C8 95 8 60 -8 40 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M-8 75 C-20 90 -16 105 -8 115 C0 105 4 90 -8 75 Z" fill="#0284c7" opacity="0.9"/>
      <line x1="-8" y1="40" x2="-8" y2="120" stroke="#78350f" stroke-width="3"/>
    </g>

    <!-- Center Dangling Nimbu-Mirchi / Bead Charm -->
    <g transform="translate(256, 396)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#78350f" stroke-width="4"/>
      <circle cx="0" cy="28" r="7" fill="#d97706"/>
      <circle cx="0" cy="44" r="12" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
      <circle cx="-3" cy="41" r="3" fill="#ffffff"/>
      <path d="M-4 56 Q-10 80 -4 100 Q0 84 4 56 Z" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
    </g>

    <!-- Right Dangling Feather -->
    <g transform="translate(316, 370) rotate(14)">
      <line x1="0" y1="0" x2="8" y2="40" stroke="#d97706" stroke-width="4"/>
      <circle cx="4" cy="20" r="5" fill="#f59e0b"/>
      <!-- Feather blade -->
      <path d="M8 40 C-8 60 -8 95 8 115 C24 95 24 60 8 40 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M8 75 C-4 90 0 105 8 115 C16 105 20 90 8 75 Z" fill="#d97706" opacity="0.9"/>
      <line x1="8" y1="40" x2="8" y2="120" stroke="#78350f" stroke-width="3"/>
    </g>
  </g>

  <!-- Ambient Physics Sparkles ✦ -->
  <g fill="#fbbf24">
    <!-- Top right sparkle -->
    <path d="M400 110 Q400 125 415 125 Q400 125 400 140 Q400 125 385 125 Q400 125 400 110 Z"/>
    <!-- Left side sparkle -->
    <path d="M100 220 Q100 232 112 232 Q100 232 100 244 Q100 232 88 232 Q100 232 100 220 Z"/>
    <!-- Bottom right sparkle -->
    <path d="M410 390 Q410 400 420 400 Q410 400 410 410 Q410 400 400 400 Q410 400 410 390 Z"/>
  </g>
</svg>
